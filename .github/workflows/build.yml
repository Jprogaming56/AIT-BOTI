name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check compile-only jars
        run: |
          for f in immersive-portals ait amblekit; do
            ls libs/$f-*.jar >/dev/null 2>&1 || { echo "::error::libs/$f-<version>.jar is missing"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Build jar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ait-portals-compat
          path: build/libs/*.jar
