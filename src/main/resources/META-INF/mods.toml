modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="ait_portals_compat.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Immersive Portals core (jar also provides immersive_portals + q_misc_util)
[[dependencies.${mod_id}]]
    modId="imm_ptl_core"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Adventures in Time (loaded by AIT Forger, whose own modId is "aitforger")
[[dependencies.${mod_id}]]
    modId="ait"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
